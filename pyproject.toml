[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]


[project]
name = "neuroseqbench"
version = "0.1.0"
authors = [
    { name = "Chenxiang Ma", email = "chenxiang.ma@connect.polyu.hk" },
    { name = "Xinyi Chen",   email = "xinyi_chen@zju.edu.cn" },
    { name = "Yanchen Li",   email = "liyc5929@gmail.com" },
]
description = ""
readme = "README.md"
requires-python = ">=3.10"
keywords = ["Neuromorphic Computing", "Temporal Processing", "Brain-Inspired Benchmark"]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "einops",
    "dcls",
    "datasets",
    "h5py",
    "tqdm",
    "pandas",
    "scipy",
    "scikit-learn",
    "toml",
]