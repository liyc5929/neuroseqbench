version = "0.0.1"
authors = [
    { name = "Chenxiang Ma", email = "chenxiang.ma@connect.polyu.hk" },
    { name = "Xinyi Chen",   email = "xinyi_chen@zju.edu.cn" },
    { name = "Yanchen Li",   email = "liyc5929@gmail.com" },
]
description = ""
